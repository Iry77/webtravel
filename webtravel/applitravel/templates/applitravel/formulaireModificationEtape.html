{% extends 'applitravel/base.html' %}

{% block title %}
Modification d'une étape
{% endblock %}

{% block main %}
<h2>Modifier l'étape « {{ etape.ville.NomVille }} » du voyage {{ voyage.Titre }}</h2>
    <form action="{% url 'modifier_etape' voyage.IDVoyage etape.IDEtape %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Modifier</button>
        <a href="{% url 'voyage' voyage.IDVoyage %}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
