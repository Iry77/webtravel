{% extends 'applitravel/base.html' %}

{% block title %}
Modification d'une ville
{% endblock %}

{% block main %}
    <h2>Modification d'une ville</h2>
        <form action="{% url 'modifier_ville' ville.IDVille %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Modifier</button>
        <a href="{% url 'villes' %}" class="btn btn-secondary">Annuler</a>
    </form>
{% endblock %}
