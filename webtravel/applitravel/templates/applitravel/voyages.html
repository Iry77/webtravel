{% extends 'applitravel/base.html' %}

{% block title %}
Les voyages
{% endblock %}

{% block main %}
    <h2>Voici les {{voyages|length}} voyages que nous vous proposons</h2>
        <div>
            {% for voy in voyages %}
            <div>
                <a href="/voyages/{{voyage.IDVoyage}}">
                    <img src="{{MEDIA_URL}}{{voy.image}}" width="200" alt="Image de voyage" title="{{voy.Titre}}">
            </div>
        </div>
        <div>
            {{voy.Titre}}
        </div>
        <div>
            <a href="{{voy.IDVoyage}}">Détail</a>
            <a href="{{voy.IDVoyage}}/update"><i class="bi bi-pencil-fill"></i></a>
            <a href="{{voy.IDVoyage}}/delete"><i class="bi bi-trash"></i></a>
        </div>
        {% endfor %}
    </div>
{% endblock%}
