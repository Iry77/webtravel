<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>Les villes</title>
    </head>
    <body>
        <header>
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link" href="/voyages/">Les voyages</a> 
                </li>
                <li class="nav-item">
                    <a class="nav-link-active" aria-current="page" href="/villes/">Les villes</a>
                </li>
            </ul>
        </header>
        <main>
            <h2>Voici les {{villes|length}} villes que vous pouvez visiter</h2>
            <ul>
                {% for vil in villes %}
                    <li>{{vil.IDVille}} {{vil.NomVille}} ({{vil.NomPays}}) </li>
                {% endfor %}
            </ul>
        </main>
        <footer>
            (c) Mon agence de voyages
        </footer>
    </body>
</html>
