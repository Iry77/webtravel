{% extends 'applitravel/base.html' %}

{% block title %}
Les voyages
{% endblock %}

{% block main %}
    <h2>Voici les {{villes|length}} villes que vous pouvez visiter</h2>
        <ul>
            {% for vil in villes %}
                <li>{{vil.IDVille}} {{vil.NomVille}} ({{vil.NomPays}}) </li>
            {% endfor %}
        </ul>
{% endblock%}
