{% extends 'applitravel/base.html' %}

{% block title %}
Connexion
{% endblock %}

{% block main %}
    <h2>Connexion</h2>
    {% if form.errors %}
    <div class="alert alert-danger" role="alert">Identifiant ou mot de passe incorrect.</div>
    {% endif %}
    <form id="login-form" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
            <label for="id_username" class="form-label">Identifiant</label>
            <input type="text" class="form-control" id="id_username" name="username" placeholder="Votre identifiant" value="{{ form.username.value|default_if_none:'' }}" required autofocus>
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="id_password" name="password" placeholder="Votre mot de passe" required>
        </div>
        <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>
    <div class="mt-3">
        <small>Pas encore inscrit ? <a href="{% url 'register' %}">S'inscrire</a></small>
    </div>
{% endblock %}
